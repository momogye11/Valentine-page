<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Pour Morgane 💫</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Particules flottantes permanentes -->
    <div class="floating-particles" id="floatingParticles"></div>

    <!-- Page d'intro : l'expéditeur est annoncé ici, avant tout le reste -->
    <div class="intro-screen" id="introScreen">
        <div class="intro-content">
            <h1 class="intro-title">Morgane</h1>
            <p class="intro-message">C'est Mohamed.<br>40 secondes de ton temps, pas plus.</p>
            <button class="intro-btn" id="introBtn">Vas-y, j'écoute</button>
        </div>
    </div>

    <!-- Courte transition, toujours passable -->
    <div class="loading-screen" id="loadingScreen">
        <div class="loading-content">
            <h1 class="loading-name">Morgane</h1>
            <p class="loading-message">Deux secondes, je pose le décor</p>
            <div class="loading-countdown" id="loadingCountdown">5</div>
            <button class="skip-btn" id="skipLoadingBtn">Passer →</button>
        </div>
    </div>

    <!-- Explosion visuelle -->
    <div class="explosion-screen" id="explosionScreen">
        <div class="flash-white" id="flashWhite"></div>
        <div class="explosion-name" id="explosionName">MORGANE</div>
        <canvas id="confettiCanvas"></canvas>
    </div>

    <!-- Messages cinématiques -->
    <div class="cinematic-screen" id="cinematicScreen">
        <p class="cinematic-message" id="cinematicMessage"></p>
        <button class="skip-btn skip-cinematic" id="skipCinematicBtn">Passer →</button>
    </div>

    <!-- Écran de choix : les deux boutons sont réels, aucun ne fuit -->
    <div class="choice-screen" id="choiceScreen">
        <div class="choice-content">
            <h2 class="choice-question" id="choiceQuestion">Un resto. Un soir de ton choix.<br>Ça te dit ?</h2>
            <div class="choice-buttons" id="choiceButtons">
                <button class="btn-no" id="noBtn">Non, ça ira</button>
                <button class="btn-yes" id="yesBtn">Pourquoi pas 👀</button>
            </div>
            <p class="choice-hint" id="choiceHint">Réponds ce que tu penses vraiment, y a zéro pression.</p>
            <p class="choice-answer" id="choiceAnswer"></p>
            <p class="choice-signature" id="choiceSignature">Mohamed ✨</p>
        </div>
    </div>

    <!-- Le numéro de version évite qu'un ancien script reste en cache après un déploiement. -->
    <script src="script.js?v=morgane-v1"></script>
</body>
</html>
