<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veut tu etre ma Valentine?</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="emoji">
                <img src="image.png" alt="Cute cat">
            </div>
            <h1 class="question" id="questionText"></h1>
            <div class="buttons" id="buttonsContainer">
                <button class="btn-no" id="noBtn">Non</button>
                <button class="btn-yes" id="yesBtn">Oui</button>
            </div>
            <p class="hint" id="hintText">Le "Non" est gêné 😈</p>
            <div class="success" id="successGif">
                <img src="" alt="Celebration" id="gifImage">
            </div>
        </div>
    </div>
    <!-- YouTube invisible en arrière-plan -->
    <div id="youtube-audio" style="position: fixed; bottom: -100px; left: -100px; width: 1px; height: 1px; opacity: 0; pointer-events: none; display: none;">
        <iframe id="youtube-iframe" width="1" height="1"
                src=""
                frameborder="0"
                allow="autoplay; encrypted-media"
                allowfullscreen>
        </iframe>
    </div>
    <!-- Audio element pour la musique -->
    <audio id="background-music" loop style="display: none;">
        <source src="Rue de St-Gobain 4.m4a" type="audio/mp4">
    </audio>
    <script src="script.js"></script>
</body>
</html>
