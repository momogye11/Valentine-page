<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veut tu etre ma Valentine?</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Bouton activer son -->
    <button id="sound-btn" style="position: fixed; top: 20px; right: 20px; z-index: 10000; background: #ff3b7a; color: white; border: none; padding: 12px 24px; border-radius: 50px; font-size: 16px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 12px rgba(255,59,122,0.4);">
        🔊 Activer le son
    </button>
    <div class="container">
        <div class="card">
            <div class="emoji">
                <img src="image.png" alt="Cute cat">
            </div>
            <h1 class="question" id="questionText"></h1>
            <div class="buttons" id="buttonsContainer">
                <button class="btn-no" id="noBtn">Non</button>
                <button class="btn-yes" id="yesBtn">Oui</button>
            </div>
            <p class="hint" id="hintText">Le "Non" est gêné 😈</p>
            <div class="success" id="successGif">
                <img src="" alt="Celebration" id="gifImage">
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
