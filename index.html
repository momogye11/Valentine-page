<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#764ba2">
    <title>Pour Morgane 💫</title>
    <!-- IMPORTANT : garder le même ?v= sur le CSS et le JS, et l'incrémenter à chaque déploiement.
         Sans ça le navigateur ressert l'ancienne feuille de style et la page s'affiche cassée. -->
    <link rel="stylesheet" href="style.css?v=morgane-v3">
</head>
<body>
    <!-- Particules flottantes permanentes -->
    <div class="floating-particles" id="floatingParticles"></div>

    <!-- Page d'intro : l'expéditeur est annoncé ici, avant tout le reste -->
    <div class="intro-screen" id="introScreen">
        <div class="intro-content">
            <p class="eyebrow">Une question, une seule</p>
            <h1 class="intro-title">Morgane</h1>
            <p class="intro-message">C'est Mohamed.<br>Quarante secondes chrono.</p>
            <button class="btn btn-primary intro-btn" id="introBtn">Vas-y, j'écoute</button>
        </div>
    </div>

    <!-- Écran de compte à rebours -->
    <div class="loading-screen" id="loadingScreen">
        <div class="loading-content">
            <h1 class="loading-name">Morgane</h1>
            <p class="loading-message">Deux secondes, je pose le décor</p>
            <div class="loading-countdown" id="loadingCountdown">24</div>
            <p class="loading-subtext">Laisse tourner, j'ai galéré sur cette partie</p>
        </div>
    </div>

    <!-- Explosion visuelle -->
    <div class="explosion-screen" id="explosionScreen">
        <div class="flash-white" id="flashWhite"></div>
        <div class="explosion-name" id="explosionName">MORGANE</div>
        <canvas id="confettiCanvas"></canvas>
    </div>

    <!-- Messages cinématiques -->
    <div class="cinematic-screen" id="cinematicScreen">
        <p class="cinematic-message" id="cinematicMessage"></p>
    </div>

    <!-- Écran de choix : les deux boutons sont réels, aucun ne fuit -->
    <div class="choice-screen" id="choiceScreen">
        <!-- tabindex="-1" : sans lui, le focus() du script est ignoré et le lecteur
             d'écran resterait sur l'écran précédent. -->
        <div class="choice-card" tabindex="-1" role="group" aria-labelledby="choiceQuestion">
            <p class="eyebrow" id="choiceEyebrow">La fameuse question</p>
            <h2 class="choice-question" id="choiceQuestion">Tu manges toujours,<br>j'imagine&nbsp;?</h2>

            <div class="choice-buttons" id="choiceButtons">
                <button class="btn btn-secondary" id="noBtn">Nan, ça ira</button>
                <button class="btn btn-primary" id="yesBtn">Pourquoi pas</button>
            </div>

            <!-- Pas de "celui de gauche" : sous 480px les boutons s'empilent et la phrase serait fausse. -->
            <p class="choice-hint" id="choiceHint">Deux boutons, aucun piège. Les deux marchent vraiment.</p>
            <p class="choice-answer" id="choiceAnswer"></p>

            <p class="choice-signature" id="choiceSignature">Mohamed</p>
        </div>
    </div>

    <script src="script.js?v=morgane-v3"></script>
</body>
</html>
