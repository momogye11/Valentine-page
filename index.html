<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veut tu etre ma Valentine?</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="emoji">
                <img src="image.png" alt="Cute cat">
            </div>
            <h1 class="question" id="questionText"></h1>
            <div class="buttons" id="buttonsContainer">
                <button class="btn-no" id="noBtn">Non</button>
                <button class="btn-yes" id="yesBtn">Oui</button>
            </div>
            <p class="hint" id="hintText">Le "Non" est gêné 😈</p>
            <div class="success" id="successGif">
                <img src="" alt="Celebration" id="gifImage">
            </div>
        </div>
    </div>
    <!-- Lecteur Spotify en bas à droite -->
    <div style="position: fixed; bottom: 20px; right: 20px; z-index: 9999;">
        <iframe style="border-radius:12px" src="https://open.spotify.com/embed/track/6MWtB6iiXyIwun0YzU6DFP?utm_source=generator&autoplay=1" width="300" height="80" frameBorder="0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
    </div>
    <script src="script.js"></script>
</body>
</html>
